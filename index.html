<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E"
      />
    <script type="module" src="/src/main.js"></script>
    <title>davide fornelli</title>
  </head>
  <body>
    <main class="page">
      <div class="page__inner">
        <section class="intro" aria-label="Davide Fornelli introduction">
          <div class="intro__header">
            <h1 class="intro__line intro__name">Davide Fornelli</h1>
          </div>
          <div class="intro__content">
            <p class="intro__line intro__location">
              <svg class="intro__location-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0ZM14.5 10a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z" clip-rule="evenodd" />
              </svg>
              Bari, Italy
            </p>
          <p class="intro__line">Computer Science Student @ UNIBA</p>
          <p class="intro__line">FullStack Developer @ Deloitte</p>
          <p class="intro__line"> 
            I like building stuff, and running.
            Currently open to software engineering opportunities at early-stage startups.
          </p>
          <nav class="intro__links" aria-label="Primary links">
            <a href="mailto:fornelli.dv@gmail.com">Mail</a>
            <a
              href="https://github.com/ddavidefornelli"
              target="_blank"
              rel="noopener noreferrer"
            >
              GitHub
            </a>
            <a href="/davide-fornelli.pdf" target="_blank" rel="noopener noreferrer">
              CV
            </a>
          </nav>
          </div>
          <figure class="intro__photo">
            <img
              class="intro__portrait"
              src="/victoria-harbour.webp"
              alt="Davide Fornelli davanti allo skyline di Hong Kong"
              width="1120"
              height="840"
              fetchpriority="high"
            />
            <figcaption>Fig. 01 — Somewhere away from the keyboard. / Hong Kong</figcaption>
          </figure>
        </section>

        <section class="section" aria-labelledby="portfolio-heading">
          <div class="section__rule" aria-hidden="true"></div>
          <div class="section__header">
            <h2 class="section__title" id="portfolio-heading">projects</h2>
            <p class="section__text"></p>
          </div>
          <div class="portfolio-grid" id="portfolio-cards"></div>
        </section>

        <section class="cube-section" aria-label="Portrait in 3D">
          <portrait-cube></portrait-cube>
        </section>
      </div>
    </main>
  </body>
</html>
